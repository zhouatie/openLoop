name: Build Desktop App (macOS DMG)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release?'
        required: true
        type: boolean
        default: true

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build macOS DMG (Universal / arm64 + x64)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set dynamic version from Git Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Setting package version to $VERSION from tag $GITHUB_REF_NAME"
          npm version $VERSION --no-git-tag-version --allow-same-version
          pnpm --filter @openloop/desktop exec npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Build Web app and Electron packages
        run: |
          pnpm run build
          # Ad-hoc sign macOS binaries with '-' so the bundle has a valid ad-hoc signature
          # rather than a broken/missing resource seal.
          npx electron-builder --mac -c.mac.identity="-" --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List built release artifacts
        run: ls -lh release/

      - name: Create or Update GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
