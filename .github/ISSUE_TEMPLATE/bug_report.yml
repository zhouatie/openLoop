name: 缺陷报告
description: 报告一个可复现的问题
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索[已有 Issue](https://github.com/zhouatie/openLoop/issues)，避免重复。
        安全问题请勿公开提交，按 [SECURITY.md](https://github.com/zhouatie/openLoop/blob/main/SECURITY.md) 私密报告。
  - type: dropdown
    id: form
    attributes:
      label: 运行形态
      options:
        - Electron 桌面客户端
        - 浏览器 Web 界面
        - CLI
        - Docker
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 客户端内「设置 → 关于」或 `pnpm cli --version`
      placeholder: 0.8.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: macOS 15.1 / Node 22.11 / pnpm 10.4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附截图、录屏或错误堆栈会大幅提高定位速度。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 粘贴相关日志。属于稳定版问题时可附 `~/.openloop/` 下对应任务日志。
      render: shell
    validations:
      required: false
