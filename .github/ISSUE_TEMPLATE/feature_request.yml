name: 功能建议
description: 提出新的能力、改进或体验优化
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 说明场景与当前的阻碍，而不是直接给出实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，以及为什么不选它们。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考实现、相关 Issue 链接。
    validations:
      required: false
